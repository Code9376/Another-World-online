<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
 <title>{{ if .IsHome }}{{ site.Title }} | {{ site.Params.description }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/">{{ site.Title }}</a>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <p>© {{ now.Year }} {{ site.Title }}</p>
  </footer>
</body>
</html>
